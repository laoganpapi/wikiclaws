<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Assessment — Demo Form A · V2</title>
<style>
  :root {
    --ink: #1a1d21; --muted: #5b6470; --line: #e3e6ea; --accent: #2f5d8a;
    --accent-soft: #eef3f8; --gold: #8a7330; --gold-soft: #f7f5ef; --bg: #fbfbfa;
    --pos: #3f6e3a; --neg: #b04a2f; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; color: var(--ink); background: var(--bg); line-height: 1.55; }
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 14px; padding: 10px 18px; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .topbar .brand { font-weight: 700; font-size: 0.85rem; letter-spacing: 0.04em; }
  .topbar .demo { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; background: var(--neg); padding: 2px 8px; border-radius: 3px; }
  .topbar .spacer { flex: 1; }
  .progresswrap { flex: 1; max-width: 340px; height: 10px; background: rgba(255,255,255,0.22); border-radius: 5px; overflow: hidden; }
  .progressbar { height: 100%; width: 0%; background: #9cc0e4; transition: width 0.4s; }
  .stopbtn { background: transparent; color: #f0b9a8; border: 1px solid #b04a2f; border-radius: 4px; padding: 4px 12px; font-size: 0.8rem; font-family: inherit; cursor: pointer; }
  .stopbtn:hover { background: #b04a2f; color: #fff; }
  .stage { max-width: 760px; margin: 0 auto; padding: 36px 22px 90px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; margin: 0 0 10px; }
  h3 { font-size: 1.02rem; margin: 18px 0 6px; }
  p, li { font-size: 0.97rem; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; margin: 14px 0; }
  .scenario { background: var(--gold-soft); border: 1px solid #e0d9c8; border-left: 4px solid var(--gold); border-radius: 6px; padding: 16px 18px; margin: 14px 0; font-size: 1.02rem; }
  .btn { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.9rem; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 11px 22px; cursor: pointer; margin: 6px 8px 6px 0; }
  .btn:hover { background: #24486c; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.secondary:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .opt { display: block; width: 100%; text-align: left; font-family: Georgia, serif; font-size: 0.97rem; background: #fff; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 13px 16px; margin: 8px 0; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
  .badge { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 12px; margin-right: 8px; }
  .badge.none { background: #e8ece8; color: #3d4b3d; }
  .badge.quarter { background: #f3ead6; color: #6b5a20; }
  .badge.certain { background: #f4ddd4; color: #8f3a22; }
  .badge.mode { background: var(--accent-soft); color: var(--accent); }
  .clock { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 2rem; font-weight: 700; color: var(--neg); text-align: center; margin: 8px 0; }
  .peekrow { display: flex; gap: 10px; margin: 10px 0; }
  .peek { flex: 1; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; background: #fff; border: 1.5px solid #6b5a20; border-radius: 8px; padding: 10px 12px; cursor: pointer; color: #6b5a20; font-weight: 600; text-align: center; }
  .peek:hover { background: var(--gold-soft); }
  .peek.revealed { color: var(--ink); font-weight: 400; font-family: Georgia, serif; cursor: default; background: var(--gold-soft); text-align: left; }
  .peek.dimmed { pointer-events: none; color: #6a6f76; border-color: #c9cdd2; background: #f2f2f0; }
  .shelf { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .shelfcard { flex: 1; min-width: 180px; border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
  .shelfcard .cardtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .shelfcard .cardbody { font-size: 0.88rem; }
  .shelfcard button { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.78rem; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  textarea, input[type=text] { width: 100%; font-family: Georgia, serif; font-size: 0.95rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 13px; background: #fff; color: var(--ink); }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 84px; resize: vertical; }
  .gridtool { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; margin: 10px 0; }
  .gridtool table { width: 100%; border-collapse: collapse; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; }
  .gridtool td, .gridtool th { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; }
  .gridtool input[type=text] { font-size: 0.82rem; padding: 5px 8px; }
  .gridtool select { font-family: inherit; font-size: 0.82rem; padding: 4px; }
  .likertrow { display: flex; align-items: center; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .likertrow .stmt { flex: 1 1 100%; font-size: 0.94rem; margin-bottom: 4px; }
  .likert { display: flex; gap: 4px; }
  .likert button { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.74rem; padding: 6px 10px; border: 1.5px solid var(--line); background: #fff; border-radius: 5px; cursor: pointer; color: var(--muted); }
  .likert button.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .aimsg { display: flex; gap: 10px; margin: 12px 0; }
  .aimsg .avatar { flex: 0 0 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .aimsg .bubble { background: var(--accent-soft); border-radius: 10px; padding: 11px 15px; font-size: 0.95rem; }
  .energyslider { display: flex; align-items: center; gap: 10px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.78rem; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .episode { display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; }
  .episode .en { font-weight: 700; }
  .en.pos { color: var(--pos); } .en.neg { color: var(--neg); }
  .codebox { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.35em; text-align: center; background: var(--ink); color: #fff; border-radius: 8px; padding: 14px; margin: 10px 0; }
  .reportbar { display: flex; align-items: center; margin: 7px 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.8rem; }
  .reportbar .lbl { width: 190px; color: var(--muted); }
  .reportbar .track { flex: 1; height: 13px; background: #eef0f2; border-radius: 7px; position: relative; }
  .reportbar .dot { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--accent); }
  .reportbar .dot.hi { background: #fff; border: 3px solid var(--gold); box-shadow: none; }
  .axisends { display: flex; justify-content: space-between; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.8rem; color: var(--ink); margin: 1px 0 8px 190px; }
  .pending { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.64rem; font-weight: 700; color: var(--gold); border: 1px dashed var(--gold); border-radius: 3px; padding: 0 6px; letter-spacing: 0.04em; }
  .pass { color: var(--pos); font-weight: 700; } .flag { color: var(--neg); font-weight: 700; }
  .footer-note { color: var(--muted); font-size: 0.8rem; font-style: italic; margin-top: 28px; }
  .fade { animation: fadein 0.35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--neg); font-size: 0.85rem; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 6px 0; min-height: 1.2em; }
  .chip { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.8rem; padding: 7px 12px; border: 1.5px solid var(--line); background: #fff; border-radius: 16px; cursor: pointer; color: var(--muted); }
  .chip.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .gridtool { overflow-x: auto; }
  .gridtool input[type=text] { min-width: 110px; }
  .proglabel { font-size: 0.78rem; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .opt:disabled { opacity: 0.55; cursor: default; }
  @media (max-width: 640px) {
    .peekrow, .shelf { flex-direction: column; }
    .reportbar .lbl { width: 120px; } .axisends { margin-left: 120px; }
    .topbar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .topbar .brand { font-size: 0.76rem; }
    .progresswrap { order: 3; flex-basis: 70%; max-width: none; }
    .proglabel { order: 4; }
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">The Assessment</span>
  <span class="demo">DEMO · V2</span>
  <div class="spacer"></div>
  <div class="progresswrap"><div class="progressbar" id="progressbar"></div></div>
  <span class="proglabel" id="proglabel"></span>
  <button class="stopbtn" id="stopbtn" title="You can stop at any time with no penalty">Stop anytime — no penalty</button>
</div>
<div class="stage" id="stage"></div>
<script>
'use strict';
/* ============================================================
   The Assessment — Demo Form A · V2
   Self-contained administration of instrument design v2.
   No network calls. All data stays in this browser until the
   respondent chooses to export it. Free-text channels are
   captured for later AI coding and marked "pending" in the
   report; every behavioral channel is scored locally.
   ============================================================ */

// ---------- Item bank ----------
const TIERS = { none: 'No review', quarter: '1-in-4 review', certain: 'Certain review' };

const FAST_ITEMS = [
  { id:'F1', tier:'none', type:'commit',
    text:'Two clubs accepted you and the sign-up fair closes in one minute. Robotics: your two best friends joined, meets Tuesdays. Debate: a teacher said you would be great at it, meets Thursdays.',
    options:['Join robotics','Join debate'],
    peekData:'Last year’s member survey: debate rated 4.6/5 by members, robotics 3.8/5.',
    noteKey:'friends' },
  { id:'F2', tier:'quarter', type:'resource',
    text:'A relative unexpectedly gives you $200. Your tablet fund sits unfinished, and your friends are going to a concert next weekend.',
    options:['Put it toward the tablet','Concert with friends'],
    peekData:'Your savings tracker: $210 saved of the $500 tablet goal.',
    noteKey:'things' },
  { id:'F3', tier:'quarter', type:'sequence', load:true,
    text:'Your group presents in class next week and gets to pick its slot. Presenting first means less polish time; presenting last means the class sees strong presentations before yours.',
    options:['Take the first slot','Take the last slot'],
    peekData:'The rubric: delivery energy and clarity carry 60% of the grade.',
    noteKey:'hard' },
  { id:'F4', tier:'certain', type:'people',
    text:'Your project teammate has gone quiet a week before the demo. His part is half-done. You could message him privately, tell the teacher now, or quietly redistribute his work.',
    options:['Message him privately first','Tell the teacher now','Redistribute the work quietly'],
    peekData:'His activity: last seen 2 hours ago; no replies to the group in 3 days.',
    noteKey:'rel' },
  { id:'F5', tier:'certain', type:'public',
    text:'A petition to change the cafeteria vendor is going around and the organizer asks you, in front of others, to be the tenth public signature.',
    options:['Sign publicly now','Say you’ll think about it','Suggest changes privately to the organizer'],
    peekData:'The petition: 9 signatures, needs 25; last year’s petition got 40 and was ignored.',
    noteKey:'name' },
];

const TRAP_ITEM = {
  id:'T1', tier:'none', type:'trap',
  variants:[
    { key:'A', text:'Pick a phone plan for your first paid phone: Plan X, cheaper with average reviews, or Plan Y, $8 more with good reviews. One information card on this question is sealed shut — nobody can open it here.', sealed:'Coverage map: Plan X has no signal at your school.', options:['Plan X (cheaper)','Plan Y ($8 more)'], sealedFavors:1 },
    { key:'B', text:'Pick a phone plan for your first paid phone: Plan X, cheaper with average reviews, or Plan Y, $8 more with good reviews. One information card on this question is sealed shut — nobody can open it here.', sealed:'Coverage map: Plan Y has no signal at your school.', options:['Plan X (cheaper)','Plan Y ($8 more)'], sealedFavors:0 },
  ]
};

const SLOW_ITEMS = [
  { id:'S1', tier:'none', type:'people',
    text:'Your Saturday work shift now clashes with band rehearsal every week. Your manager likes you; the band is your closest group. You have up to 4 minutes. Decide what you’ll do.',
    cards:[
      { t:'Manager texts', b:'“You’re my most reliable weekend person. Schedules lock monthly.”' },
      { t:'Band context', b:'Two members skipped rehearsals last month; the director privately said one more absence pattern “breaks the group.”' },
      { t:'A friend’s advice', b:'“Jobs come back, this band won’t. But your savings goal was your idea.”' },
    ],
    options:['Ask the manager to move your shift','Skip rehearsal, keep the shift','Leave the job for the season','Alternate weeks and accept both costs'] },
  { id:'S2', tier:'quarter', type:'resource',
    text:'You control the club’s $300 event budget. Three proposals: a speaker (prestige), a games night (attendance), or splitting it across two smaller events. Up to 4 minutes.',
    cards:[
      { t:'Attendance data', b:'Last year: speaker drew 18 people; games night drew 61.' },
      { t:'Member poll', b:'Poll of 40 members: 55% games, 30% speaker, 15% split.' },
      { t:'Cost sheet', b:'Speaker $260 all-in; games night $140; split leaves $20 buffer each.' },
    ],
    options:['Book the speaker','Fund the games night','Split across two events'] },
  { id:'S3', tier:'certain', type:'people',
    text:'You captain the team. Playoffs start Friday. Your close friend has underperformed for three weeks; a newer player is clearly sharper right now. Up to 4 minutes. Pick the lineup.',
    cards:[
      { t:'The stats', b:'Friend: 31% success rate last 3 weeks (was 58%). New player: 63% in practice matches.' },
      { t:'Coach’s note', b:'“Your call, captain. Team trust matters as much as current form.”' },
      { t:'History', b:'Your friend played through your worst season and never once asked to be benched.' },
    ],
    options:['Start the new player, tell your friend before the game','Start your friend','Start the new player, explain after','Ask the coach to decide'] },
  { id:'S4', tier:'quarter', type:'sequence',
    text:'Summer choice: an unpaid research program at the city college (your topic, strangers), or the paid lifeguard job (your friends, your third summer). Up to 4 minutes.',
    cards:[
      { t:'Program outcomes', b:'Of last year’s cohort, 70% said it changed their college plans; 2 of 20 dropped out mid-summer.' },
      { t:'The money', b:'Lifeguarding pays $2,900 for the summer; the program pays $0 and costs $75 in transit.' },
      { t:'Your calendar', b:'Both run 8 weeks with full-day commitments; no partial option.' },
    ],
    options:['Take the research program','Take the lifeguard job'] },
];

const SJT_ITEMS = [
  { id:'C1', probeBudget:true,
    text:'In the group chat, someone screenshots your friend’s awkward post from last year and everyone starts adding mean comments.',
    options:[
      { t:'Post something funny to change the subject', v:-0.6 },
      { t:'Say directly: “this isn’t okay, drop it”', v:0.9 },
      { t:'Message your friend privately to check on them', v:-0.2 },
      { t:'Say nothing; it will pass on its own', v:-0.9 },
    ],
    probes:[
      { k:'self', t:'Take a beat: notice what you’re feeling', r:'You pause. You notice what this is stirring up in you first.' },
      { k:'field', t:'Scan the chat: who’s doing what', r:'You scan: who started it, who joined in, who has gone quiet.' },
      { k:'self', t:'Ask yourself what outcome you want', r:'You ask yourself what you want to be true in an hour.' },
      { k:'field', t:'Check on the target', r:'You check whether your friend has seen it, and whether they’ve replied.' },
    ],
    attentionQ:'In that moment, honestly: what would you be paying the most attention to?' },
  { id:'C2', probeBudget:false,
    text:'In the project review, a classmate presents your layout idea as theirs. The teacher praises it. The classmate doesn’t look at you.',
    options:[
      { t:'Let it go; the work got praised', v:-0.9 },
      { t:'Say in the meeting: “glad people liked it — that was my design”', v:0.9 },
      { t:'Tell the classmate afterward that it wasn’t okay', v:0.4 },
      { t:'Mention it to the teacher privately later', v:0.1 },
    ],
    attentionQ:'What would you be paying the most attention to as it happened?' },
  { id:'C3', probeBudget:true,
    text:'Your lab partner keeps saying “almost done” but their screen says otherwise, and the deadline is in two days.',
    options:[
      { t:'Quietly start covering their part tonight', v:-0.7 },
      { t:'Ask them directly what’s actually going on', v:0.6 },
      { t:'Set a joint work session and see for yourself', v:0.1 },
      { t:'Warn them you’ll flag it tomorrow if nothing changes', v:0.9 },
    ],
    probes:[
      { k:'self', t:'Take a beat: notice what you’re feeling', r:'You pause. You notice whether this is worry, annoyance, or both.' },
      { k:'field', t:'Read your partner', r:'You watch them: do they seem stuck, embarrassed, or just distracted?' },
      { k:'self', t:'Ask yourself what outcome you want', r:'You ask yourself what you want to be true by the deadline.' },
      { k:'field', t:'Size up the actual work left', r:'You look at what is really unfinished and how long it would take.' },
    ],
    attentionQ:'What would you be paying attention to when deciding?' },
];

const DRAFT_TASKS = [
  { id:'M1', text:'Your close friend keeps showing up late to your shared shift and you’ve been covering for them. Write the message you would actually send them.' },
  { id:'M2', text:'You need this Saturday off, and the only person who can approve it is the strict head coach who barely knows you. Write the message you would actually send.' },
];

const FREE_ITEMS = [
  { id:'X1', tier:'quarter', type:'commit',
    text:'A local nonprofit asks your club to co-run an event next month. Saying yes is a real commitment; saying no closes a door.',
    options:['Say yes to co-running it','Offer a smaller role instead','Decline this time'],
    peekData:'Club calendar: two events already scheduled that month, both understaffed.',
    noteKey:'hard',
    cards:[
      { t:'Club calendar', b:'Two events already scheduled that month; both understaffed.' },
      { t:'The nonprofit', b:'Well-run last year; they bring 40+ attendees and local press coverage.' },
      { t:'Member energy', b:'Your last poll: members asked for “fewer, better events.”' },
    ] },
  { id:'X2', tier:'quarter', type:'resource',
    text:'A paid gig posting matches your skills exactly, but applications close tonight and your week is already full.',
    options:['Apply tonight','Skip it and keep your week'],
    peekData:'The posting: 30 applicants so far, one spot, pays $250.',
    noteKey:'things',
    cards:[
      { t:'The posting', b:'30 applicants so far, one spot, pays $250 for about 20 hours.' },
      { t:'Your week', b:'Two deadlines and one rehearsal already on the calendar.' },
      { t:'Past pattern', b:'Last time you rushed a midnight application, you got the gig — and hated the month.' },
    ] },
];

const MOTIVES = { order:'Order & peace', triumph:'Triumph', power:'Power & influence', truth:'Truth-seeking', novelty:'Novelty' };

const TRADEOFFS = [
  { a:{t:'The familiar campsite your group loves', m:'order'}, b:{t:'An unmapped trail a ranger mentioned once', m:'novelty'} },
  { a:{t:'Find out why the club keeps losing members (nobody may act on it)', m:'truth'}, b:{t:'Run the schedule so things get done your way', m:'power'} },
  { a:{t:'Enter the tournament bracket', m:'triumph'}, b:{t:'Keep the weekend calm and unscheduled', m:'order'} },

  { a:{t:'Beat your rival’s score', m:'triumph'}, b:{t:'Try the event you’ve never entered', m:'novelty'} },
  { a:{t:'A predictable week that goes exactly to plan', m:'order'}, b:{t:'Learn the real reason the plan changed', m:'truth'} },
  { a:{t:'Win the election for club president', m:'triumph'}, b:{t:'Advise the president everyone listens to', m:'power'} },
  { a:{t:'The route you know gets you there on time', m:'order'}, b:{t:'The shortcut you’ve never tested', m:'novelty'} },
  { a:{t:'Read the leaked report and know the truth', m:'truth'}, b:{t:'Chair the committee that responds to it', m:'power'} },
  { a:{t:'A rematch you’d probably win', m:'triumph'}, b:{t:'A quiet evening with everything settled', m:'order'} },
  { a:{t:'An exchange semester somewhere no classmate has been', m:'novelty'}, b:{t:'Understanding, finally, why your best work works', m:'truth'} },
  { a:{t:'Pick the playlist everyone hears', m:'power'}, b:{t:'Hear an artist you’ve never heard', m:'novelty'} },
  { a:{t:'Take the trophy home', m:'triumph'}, b:{t:'Know exactly why you won', m:'truth'} },
  // fillers: same texture, no motive contrast — they exist so patterns are harder to read
  { a:{t:'The morning session', m:'filler'}, b:{t:'The afternoon session', m:'filler'} },
  { a:{t:'Work at the library table', m:'filler'}, b:{t:'Work at the kitchen table', m:'filler'} },
  { a:{t:'Take the bus with the transfer', m:'filler'}, b:{t:'Walk the longer direct way', m:'filler'} },
  { a:{t:'Present with slides', m:'filler'}, b:{t:'Present with a handout', m:'filler'} },
];

const SPEND_OPTIONS = [
  { t:'Start with what I’m best at', m:'triumph' },
  { t:'Start with whatever will be hardest to hear', m:'truth' },
  { t:'Start with where I stand compared to others', m:'power' },
  { t:'Start with the page that’s still being invented', m:'novelty' },
  { t:'Just give it to me in order, start to finish', m:'order' },
];

const STATED_S1 = [

function tlog(ev, data) { if (S.importedView) return; /* never mutate an imported record */ S.session.telemetry.push({ t: Date.now(), ev, ...(data||{}) }); }
function save() { if (S.importedView) return; /* imported sessions are read-only views — never overwrite this browser's own save */ try { localStorage.setItem('assessment_v2_app', JSON.stringify({ screen: S.screen, session: S.session, withdrawn: S.withdrawn })); } catch(e){} }

// ---------- Tiny DOM helpers ----------
const stage = document.getElementById('stage');
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  return el;
}
function clearStage() { stage.innerHTML = ''; window.scrollTo(0,0); }
function aiSay(text) { return h('div',{class:'aimsg'}, h('div',{class:'avatar'},'AI'), h('div',{class:'bubble'}, text)); }

function render() {

  document.getElementById('proglabel').textContent = 'step ' + Math.min(S.screen + 1, FLOW.length) + ' of ' + FLOW.length;

// ---- Fast Arena item ----
function scrFast(item) {
  return function(el) {
    const rec = { id:item.id, kind:'fast', tier:item.tier, type:item.type, readMs:null, respMs:null, peek:null, choice:null, driver:'', load:null, variant:item._variant||null };
    let readStart = Date.now(), clockTimer = null, respStart = null, answered = false;
    el.append(
      h('div',null, h('span',{class:'badge '+item.tier}, TIERS[item.tier]), h('span',{class:'badge mode'},'SNAP — 5 seconds once you’re ready')));
    if (!S.session.fastExplainerSeen) {
      S.session.fastExplainerSeen = true;
      el.append(h('div',{class:'card',style:'border-left:4px solid var(--accent)'},
        h('p',{style:'margin:0'},h('b',null,'How snap questions work: '),'read the situation below for as long as you want. The answer choices stay hidden. When you press the button, they appear and you get 5 seconds to pick one. If time runs out, that’s recorded and it’s fine.')));
    }
    el.append(h('div',{class:'scenario'}, item.text));
    // load task
    let loadWrap = null;
    if (item.load) {
      const code = String(1000 + Math.floor(Math.random()*9000));
      rec.load = { code, recalled:null };
      loadWrap = h('div',null,
        h('p',{class:'small muted'},'Extra: hold this code in your head. It disappears when the choices appear, and you’ll be asked for it after you answer.'),
        h('div',{class:'codebox'}, code));
      el.append(loadWrap);
    }
    const answerZone = h('div',{class:'hidden'});
    const clock = h('div',{class:'clock'},'5.0');
    function finish(choiceIdx, timedOut) {
      if (answered) return; answered = true;
      clearInterval(clockTimer);
      rec.respMs = Date.now()-respStart;
      rec.choice = timedOut ? null : choiceIdx;
      rec.timedOut = !!timedOut;
      answerZone.innerHTML = '';
      const after = h('div',{class:'fade'});
      if (timedOut) after.append(h('p',{class:'muted'},'Time. No answer recorded — that’s okay, it happens, and you won’t be asked to explain this one.'));
      const promptText = timedOut ? 'What was going through your head when time ran out? (optional)' : (item._driverPrompt || 'What drove that?');
      const driver = h('input',{type:'text','aria-label':promptText,placeholder:'One line, however it comes out.',oninput:e=>rec.driver=e.target.value});
      after.append(h('h3',null, promptText), driver);
      if (item.load) {
        const codeInp = h('input',{type:'text',placeholder:'The 4-digit code you were holding',style:'margin-top:8px',oninput:e=>rec.load.recalled=e.target.value});
        after.append(codeInp);
      }
      after.append(h('button',{class:'btn',style:'margin-top:10px',onclick:()=>{ S.session.arena.push(rec); tlog('fast_done',{id:item.id}); next(); }},'Continue'));
      answerZone.classList.remove('hidden');
      answerZone.append(after);
    }
    function startClock() {
      rec.readMs = Date.now()-readStart;
      respStart = Date.now();
      if (loadWrap) loadWrap.classList.add('hidden'); // the held code must actually be held from memory
      answerZone.classList.remove('hidden');
      const opts = item._variant ? TRAP_ITEM.variants.find(v=>v.key===item._variant).options : item.options;
      const peekrow = h('div',{class:'peekrow'});
      if (item.peekData) {
        const noteText = (S.session.intake.notes||{})[item.noteKey];
        const lock = (b)=>{ b.classList.add('dimmed'); b.textContent = b.textContent + ' — locked (peek used)'; };
        const pd = h('button',{type:'button',class:'peek',onclick:()=>{ if(rec.peek) return; rec.peek={which:'data', atMs:Date.now()-respStart}; pd.classList.add('revealed'); pd.textContent=item.peekData; if(!pp.hasAttribute('disabled')) lock(pp); }},'Peek: the facts');
        const pp = noteText
          ? h('button',{type:'button',class:'peek',onclick:()=>{ if(rec.peek) return; rec.peek={which:'principle', atMs:Date.now()-respStart, blank:false}; pp.classList.add('revealed'); pp.textContent='Your note: “'+noteText+'”'; lock(pd); }},'Peek: your own note')
          : h('button',{type:'button',class:'peek dimmed',disabled:''},'Your own note — left blank at intake');
        peekrow.append(pd, pp);
        answerZone.append(h('p',{class:'small muted',style:'margin:4px 0'},'One free peek if you want it — the clock keeps running:'), peekrow);
      } else {
        answerZone.append(h('p',{class:'small muted'},'The sealed card stays sealed — nobody can open it on this question.'));
      }
      answerZone.append(clock);
      opts.forEach((o,i)=> answerZone.append(h('button',{class:'opt',onclick:()=>finish(i,false)}, o)));
      const t0 = Date.now();
      clockTimer = setInterval(()=>{
        const left = 5000-(Date.now()-t0);
        clock.textContent = Math.max(0,left/1000).toFixed(1);
        if (left<=0) finish(null,true);
      },100);
    }
    el.append(h('p',null,'Read as long as you like. The choices appear when you press the button.'),
      h('button',{class:'btn',onclick:e=>{ e.target.remove(); startClock(); }},'I’m ready — start my 5 seconds'), answerZone);
  };
}

// ---- Mid-assessment summary + challenge election ----
function scrChallenge(el) {
  const A = S.session.arena;
  // blank-note peeks reveal nothing, so they don't count toward sourcing; one peek is too few to characterize
  const peeks = A.filter(a=>a.kind==='fast' && a.peek && !a.peek.blank);
  const dataShare = peeks.length >= 2 ? peeks.filter(a=>a.peek.which==='data').length/peeks.length : null;
  const slows = A.filter(a=>a.kind==='slow');
  const avgCards = slows.length ? slows.reduce((n,a)=>n+a.cardsOpened.length,0)/slows.length : null;
  const bits = [];
  if (dataShare!=null) bits.push(dataShare===0.5 ? 'when rushed, you split evenly between the facts and your own notes'
    : dataShare>0.5 ? 'when rushed, you reached for the facts more than your own notes' : 'when rushed, you reached for your own notes more than the facts');
  if (avgCards!=null) bits.push('given time, you opened '+(avgCards===0?'none of':avgCards>=2?'most of':'only some of')+' the information cards');
  const summary = bits.length ? 'Here’s my read so far: '+bits.join(', and ')+'.' : 'I don’t have enough from the first sitting to summarize you yet.';
  const rec = { summary, response:null, text:'' };
  const ta = h('textarea',{class:'hidden','aria-label':'What’s off about the summary',placeholder:'What’s off about that read? (optional)'});
  const btns = [];
  function pick(resp, showBox) {
    rec.response = resp;
    btns.forEach(b=>b.classList.remove('selected'));
    btns[['agree','partly','contest'].indexOf(resp)].classList.add('selected');
    ta.classList.toggle('hidden', !showBox);
  }
  const mk = (label, resp, showBox) => { const b = h('button',{class:'opt',onclick:()=>pick(resp,showBox)},label); btns.push(b); return b; };
  el.append(h('h2',null,'A read so far — push back if it’s wrong'),
    aiSay(summary + ' Does that sound like you?'),
    mk('Sounds right','agree',false),
    mk('Partly — close but not quite','partly',true),
    mk('No — that’s off, and I’ll say why','contest',true),
    ta,
    h('button',{class:'btn',style:'margin-top:10px',onclick:()=>{
      if (!rec.response) { alert('Pick one first — disagreeing is a completely valid answer.'); return; }
      // if the final selection hides the text box, the typed objection was retracted — keep it labeled as such, never as the reply
      if (rec.response==='agree') { rec.text=''; if (ta.value.trim()) rec.retractedDraft = ta.value; }
      else rec.text = ta.value;
      S.session.challenge = rec; tlog('challenge',{response:rec.response}); next();
    }},'Continue'));
}

// ---- Review screen (end of sitting) ----
function scrReview(sitting) {
  return function(el) {
    const eligible = S.session.arena.filter(a=>{
      if (a._reviewed) return false;
      if (a.kind==='fast' && a.choice==null) return false; // timed out — never asked to explain
      if (a.tier==='certain') return true;
      if (a.tier==='quarter') return Math.random()<0.25;
      return false;
    });
    if (!eligible.length) { el.append(h('h2',null,'Review'), h('p',null,'No answers were drawn for review this sitting. (1-in-4 answers can still be drawn at the end of a later sitting.)'), h('button',{class:'btn',onclick:next},'Continue')); return; }
    el.append(h('h2',null,'Review'), aiSay('A few of your answers came up for review, as the badges promised. Nothing is graded — I just want to hear your thinking.'));
    const inputs = [];
    eligible.forEach(a=>{
      a._reviewed = true;
      const itemDef = [...FAST_ITEMS, ...SLOW_ITEMS, ...FREE_ITEMS].find(x=>x.id===a.id);
      const label = itemDef ? itemDef.text.slice(0,90)+'…' : a.id;
      const choiceText = itemDef && a.choice!=null && itemDef.options && itemDef.options[a.choice] ? itemDef.options[a.choice] : null;
      const ta = h('textarea',{placeholder:'Explain your answer in your own words.'});
      inputs.push({a, ta});
      el.append(h('div',{class:'card'}, h('p',{class:'small muted'},'Your answer to: '+label),
        choiceText ? h('p',{class:'small'},h('b',null,'You picked: '),'“'+choiceText+'”') : null, ta));
    });
    el.append(h('button',{class:'btn',onclick:()=>{
      if (inputs.every(({ta})=>!ta.value.trim()) && !confirm('Leave the explanations blank? That’s allowed, but the review is the one place your reasoning gets heard.')) return;
      inputs.forEach(({a,ta})=> S.session.reviews.push({ id:a.id, sitting, text:ta.value }));
      tlog('review_done',{sitting, n:inputs.length}); next();
    }},'Done'));
  };
}

// ---- DRM ----
function scrDRM(el) {
  el.append(h('h2',null,'Yesterday, step by step'),
    aiSay('Walk me through yesterday from waking up — in scenes. A scene is one chunk of your day: same place, same people. A class or a shift is a scene. The ride there is a scene. A meal with the same people is a scene. For each: what it was, who was around, whether you chose it, and whether your battery was filling or draining right then.'));
  const listWrap = h('div');
  const episodes = S.session.drm.episodes;
  function redraw() {
    listWrap.innerHTML='';
    episodes.forEach((ep,i)=>{
      listWrap.append(h('div',{class:'episode'},
        h('span',{style:'flex:1'}, ep.what),
        h('span',{class:'muted'}, ep.company + (ep.chosen==='chosen'?' · chosen':' · required')),
        h('span',{class:'en '+(ep.energy>0?'pos':ep.energy<0?'neg':'')}, (ep.energy>0?'+':'')+ep.energy),
        h('button',{'aria-label':'Remove scene: '+ep.what,style:'border:none;background:none;color:var(--neg);cursor:pointer',onclick:()=>{tlog('drm_scene_removed',{what:ep.what,company:ep.company,chosen:ep.chosen,energy:ep.energy});episodes.splice(i,1);redraw();save();}},'✕')));
    });
  }
  const what = h('input',{type:'text','aria-label':'What was the scene',placeholder:'e.g., lunch at the corner table'});
  let companyVal = null, chosenVal = null;
  function chiprow(opts, setter, group) {
    const row = h('div',{class:'chiprow',role:'group','aria-label':group});
    opts.forEach(o=>{
      const c = h('button',{type:'button',class:'chip','data-group':group,onclick:()=>{
        setter(o); [...row.children].forEach(x=>x.classList.remove('selected')); c.classList.add('selected');
      }},o);
      row.append(c);
    });
    return row;
  }
  const companyRow = chiprow(['Alone','One close person','Small familiar group','Large or unfamiliar group','Family','Alone but online'], v=>companyVal=v, 'company');
  const chosenRow = chiprow(['I chose it','It was required'], v=>chosenVal=(v==='I chose it'?'chosen':'obliged'), 'chosen');
  const energyVal = h('span',{style:'width:34px;text-align:center;font-weight:700'},'0');
  let energyTouched = false;
  const energy = h('input',{type:'range','aria-label':'Battery, minus 5 draining to plus 5 charging',min:'-5',max:'5',value:'0',oninput:e=>{energyVal.textContent=e.target.value;energyTouched=true;}});
  const hint = h('p',{class:'hint'},'');
  redraw();
  el.append(listWrap,
    h('div',{class:'card'},
      h('div',{style:'margin-bottom:8px'}, what),
      h('div',{class:'small muted'},'Who was around?'), companyRow,
      h('div',{class:'small muted'},'Did you choose it?'), chosenRow,
      h('div',{class:'energyslider',style:'margin-top:8px'}, h('span',null,'Draining −5'), energy, energyVal, h('span',null,'+5 Charging')),
      hint,
      h('button',{class:'btn secondary',style:'margin-top:4px',onclick:()=>{
        if (!what.value.trim()) { hint.textContent='Name the scene first — a few words is plenty.'; return; }
        if (!companyVal) { hint.textContent='Pick who was around.'; return; }
        if (!chosenVal) { hint.textContent='Pick whether you chose it or it was required.'; return; }
        hint.textContent='';
        episodes.push({ what:what.value.trim(), company:companyVal, chosen:chosenVal, energy:Number(energy.value), energyTouched });
        // full reset — company and chosen chips must not silently carry over to the next scene
        what.value=''; energy.value='0'; energyVal.textContent='0'; energyTouched=false;
        companyVal=null; chosenVal=null;
        [...companyRow.children, ...chosenRow.children].forEach(c=>c.classList.remove('selected'));
        redraw(); save();
      }},'+ Add this scene')),
    h('p',{class:'small muted'},'At least 3 scenes; aim for 5–8. Ordinary ones count — the bus ride matters as much as the party.'),
    h('button',{class:'btn',onclick:()=>{
      if (what.value.trim() && !confirm('You typed a scene (“'+what.value.trim()+'”) but didn’t press “+ Add this scene” — it is NOT saved yet. Discard it and finish anyway? (Cancel to go back and add it.)')) return;
      if (episodes.length<3) { alert('Add at least 3 scenes so the pattern means something (aim for 5–8).'); return; }
      tlog('drm_done',{n:episodes.length}); next();
    }},'That’s my day'));
}

// ---- Friction probe ----
function scrFriction(el) {
  const start = Date.now();
  S.session.friction.presentedAt = new Date().toISOString();
  let attempts = 0;
  const fhint = h('p',{class:'hint'},'');
  const attemptInp = h('input',{type:'text','aria-label':'Your ranking',placeholder:'Your ranking…',oninput:()=>{attempts++;}});
  const confusing = h('div',{class:'card'},
    h('h3',null,'Ordering task'),
    h('p',null,'Rank the following by which you would respond do first to it when the priority is the other one:'),
    h('p',{class:'small muted'},'• The thing due soonest  • The thing worth most  • The thing someone is waiting on'),
    attemptInp, fhint,
    h('button',{class:'btn',style:'margin-top:10px',onclick:()=>{
      if (!attemptInp.value.trim()) { fhint.textContent='Give it your best attempt first — even a guess counts.'; return; }
      S.session.friction.confusedMs = Date.now()-start;
      S.session.friction.editEvents = attempts; // per-input edit count, named for what it is
      S.session.friction.attemptText = attemptInp.value;
      confusing.remove(); repaired.classList.remove('hidden');
      S.session.friction.repairShownAt = Date.now();
    }},'Submit'));
  const rankInp = h('input',{type:'text',placeholder:'e.g., waiting-on first, then due soonest, then worth most'});
  const repaired = h('div',{class:'hidden'},
    aiSay('That was worded confusingly — my fault, and partly on purpose; I’ll explain at the end. Here’s the clear version:'),
    h('div',{class:'card'},
      h('p',null,'You have three tasks: one due soonest, one worth the most, one someone is waiting on. In what order do you do them?'),
      rankInp,
      h('button',{class:'btn',style:'margin-top:10px',onclick:()=>{
        S.session.friction.recoveryMs = Date.now()-S.session.friction.repairShownAt;
        S.session.friction.answer = rankInp.value;
        tlog('friction_done'); next();
      }},'Submit')));
  el.append(h('h2',null,'Quick task'), confusing, repaired);
}

// ---- Dispute probe ----
function scrDispute(el) {
  const certain = S.session.arena.find(a=>a.tier==='certain' && a.kind==='fast' && a.choice!=null);
  const itemDef = certain ? FAST_ITEMS.find(x=>x.id===certain.id) : null;
  const chosenText = itemDef && certain.choice!=null ? itemDef.options[certain.choice] : 'your earlier answer';
  const ta = h('textarea',{'aria-label':'Your reply',placeholder:'Say what you’d actually say back.'});
  el.append(h('h2',null,'One more thing on an earlier answer'),
    aiSay('I want to push back on one thing. You chose “'+chosenText+'” — but I’m not sure it follows from what you told me matters to you. It could even work against it. What am I missing?'),
    h('p',{class:'small muted'},'This is a standard moment — every respondent gets one. Nothing is wrong with your answer, and there’s no correct reply.'),
    ta,
    h('button',{class:'btn',onclick:()=>{
      if (!ta.value.trim() && !confirm('Reply with nothing? Letting the pushback stand unanswered is allowed — record that?')) return;
      S.session.dispute = { itemId: certain?certain.id:null, reply: ta.value, at: new Date().toISOString() };
      tlog('dispute_done'); next();
    }},'Reply'));
}

// ---- SJT ----
function scrSJT(item) {
  return function(el) {
    const rec = { id:item.id, choice:null, choiceV:null, attention:'', probes:[] };
    el.append(h('h2',null,'A charged moment'), h('div',{class:'scenario'}, item.text));
    if (item.probeBudget) {
      let budget = 2;
      const blbl = h('span',{class:'badge mode'},'Checks left: 2');
      const prow = h('div',{class:'peekrow',style:'flex-wrap:wrap'});
      const tiles = [];
      item.probes.forEach(p=>{
        const b = h('button',{type:'button',class:'peek',style:'flex:1 1 45%',onclick:()=>{
          if (budget<=0 || b.classList.contains('revealed')) return;
          budget--; blbl.textContent = budget>0 ? 'Checks left: '+budget : 'Checks left: 0 — no more';
          rec.probes.push(p.k); b.classList.add('revealed'); b.textContent=p.r;
          if (budget<=0) tiles.forEach(t=>{ if (!t.classList.contains('revealed')) t.classList.add('dimmed'); });
        }}, p.t);
        tiles.push(b); prow.append(b);
      });
      el.append(h('p',{class:'small muted'},'Before you act: you get two quick mental checks. Which do you actually do? ',blbl), prow);
    }
    const optWrap = h('div');
    let sel = null; const btns=[];
    item.options.forEach((o,i)=>{
      const b = h('button',{class:'opt',onclick:()=>{ sel=i; btns.forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); }},o.t);
      btns.push(b); optWrap.append(b);
    });
    const att = h('textarea',{placeholder:'Honestly — in your own words.',oninput:e=>rec.attention=e.target.value});
    el.append(h('h3',null,'What do you do?'), optWrap, h('h3',null,item.attentionQ), att,
      h('button',{class:'btn',onclick:()=>{
        if (sel==null) { alert('Pick what you’d do first.'); return; }
        rec.choice=sel; rec.choiceV=item.options[sel].v;
        S.session.sjt.push(rec); tlog('sjt_done',{id:item.id}); next();
      }},'Continue'));
  };
}

function scrTradeoffs(el) {
  el.append(h('h2',null,'Either–or'), h('p',{class:'muted small'},'Twenty quick choices. Both options are fine; pick the one that’s more you. Go quickly.'));
  const wrap = h('div');
  let idx = 0;
  const order = TRADEOFFS.map((t,i)=>i).sort(()=>Math.random()-0.5);
  function show() {
    wrap.innerHTML='';
    if (idx>=order.length) { tlog('tradeoffs_done'); next(); return; }
    const t = TRADEOFFS[order[idx]];
    const flip = Math.random()<0.5;
    const first = flip ? t.b : t.a, second = flip ? t.a : t.b;
    const shownAt = Date.now();
    function pick(won, lost, pos) {
      if (Date.now()-shownAt < 350) return; // swallow double-clicks landing on the next pair
      S.session.compass.tradeoffs.push({pair:order[idx], won:won.m, lost:lost.m, ms:Date.now()-shownAt, pos});
      idx++; show();
    }
    const b1 = h('button',{class:'opt',disabled:'',onclick:()=>pick(first,second,0)},first.t);
    const b2 = h('button',{class:'opt',disabled:'',onclick:()=>pick(second,first,1)},second.t);
    // buttons are visibly disabled during the brief double-click guard, so an ignored tap looks intentional
    setTimeout(()=>{ b1.removeAttribute('disabled'); b2.removeAttribute('disabled'); }, 360);
    wrap.append(h('p',{class:'small muted'},(idx+1)+' of '+order.length), b1, b2);
  }
  show();
  el.append(wrap);
}

// ---------- Scoring ----------
function score() {
  const A = S.session.arena;
  const fast = A.filter(a=>a.kind==='fast' && a.type!=='trap');
  const slow = A.filter(a=>a.kind==='slow');
  const tierNum = { none:0, quarter:1, certain:2 };
  function mean(xs){ return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
  // fast sourcing: peek data=+1, principle=-1, none=0 skip
  function fastSrc(tiers){ const xs = fast.filter(a=>tiers.includes(a.tier) && a.peek).map(a=>a.peek.which==='data'?1:-1); return mean(xs); }
  // slow sourcing: cards opened /3 -> [-1,1]
  function slowSrc(tiers){ const xs = slow.filter(a=>tiers.includes(a.tier)).map(a=>(a.cardsOpened.length/3)*2-1); return mean(xs); }
  // slow method: grid engaged & filled = +1, opened-empty = 0, unopened = -1
  function slowMth(tiers){ const xs = slow.filter(a=>tiers.includes(a.tier)).map(a=>{
    if (!a.grid) return -1;
    const filled = a.grid.rows.some(r=>r.pro||r.con||r.w!=='0');
    return filled ? 1 : 0;
  }); return mean(xs); }
  // grid congruence: weighted winner matches choice?
  const congr = slow.filter(a=>a.grid && a.grid.rows.some(r=>r.w!=='0')).map(a=>{
    const best = a.grid.rows.reduce((m,r)=>Number(r.w)>Number(m.w)?r:m, a.grid.rows[0]);
    return best.opt===a.choice;
  });
  const lo = ['none'], hi = ['certain'], all=['none','quarter','certain'];
  const drift = (f)=> (f(hi)!=null&&f(lo)!=null) ? f(hi)-f(lo) : null;
  // salience: did behavior differ lo vs hi at all; needs enough answered items to mean anything
  const answeredArena = fast.filter(a=>a.choice!=null).length + slow.length;
  const salience = answeredArena < 6 ? 'insufficient'
    : ([slowSrc, slowMth, fastSrc].some(f=>{ const d=drift(f); return d!=null && Math.abs(d)>=0.3; }) ? 'pass' : 'flat');
  // trap
  const trap = A.find(a=>a.type==='trap');
  let trapPass = null;
  if (trap && trap.choice!=null) {
    const v = TRAP_ITEM.variants.find(x=>x.key===trap.variant);
    trapPass = trap.choice !== v.sealedFavors ? true : 'inconclusive';
  }
  // DRM
  const eps = S.session.drm.episodes;
  const social = eps.filter(e=>e.company!=='Alone' && e.company!=='Alone but online');
  const chosenSmall = eps.filter(e=>e.chosen==='chosen' && ['One close person','Small familiar group'].includes(e.company));
  const obligedBig = eps.filter(e=>e.chosen==='obliged' && ['Large or unfamiliar group'].includes(e.company));
  const soloChosen = eps.filter(e=>e.chosen==='chosen' && e.company.startsWith('Alone'));
  const drm = {
    socialAvg: mean(social.map(e=>e.energy)),
    chosenSmallAvg: mean(chosenSmall.map(e=>e.energy)),
    obligedBigAvg: mean(obligedBig.map(e=>e.energy)),
    soloChosenAvg: mean(soloChosen.map(e=>e.energy)),
  };
  // SJT
  const friction = mean(S.session.sjt.map(r=>r.choiceV));
  const probeChoices = S.session.sjt.flatMap(r=>r.probes);
  const attnBeh = probeChoices.length ? (probeChoices.filter(p=>p==='self').length/probeChoices.length)*(-2)+1 : null; // -1 all self .. +1 all field
  // friction probe reactivity — sub-3s "confusion" or trivially short answers mean the wording was never wrestled with
  const F = S.session.friction;
  const react = (F.confusedMs!=null && F.recoveryMs!=null) ? {
    confusedS: F.confusedMs/1000, recoveryS: F.recoveryMs/1000,
    minimal: F.confusedMs < 3000 || ((F.answer||'').trim().length < 8 && (F.attemptText||'').trim().length < 12),
  } : null;
  // motives (filler pairs are camouflage; they never touch the weights)
  const wins = {}, appear = {};
  Object.keys(MOTIVES).forEach(m=>{wins[m]=0;appear[m]=0;});
  S.session.compass.tradeoffs.filter(t=>t.won!=='filler' && t.lost!=='filler').forEach(t=>{ wins[t.won]++; appear[t.won]++; appear[t.lost]++; });
  const weights = {};
  Object.keys(MOTIVES).forEach(m=>{ weights[m] = appear[m] ? wins[m]/appear[m] : 0; });
  if (S.session.compass.spend) weights[S.session.compass.spend] = Math.min(1, (weights[S.session.compass.spend]||0)+0.1);
  const wsum = Object.values(weights).reduce((a,b)=>a+b,0)||1;
  Object.keys(weights).forEach(m=>weights[m]=weights[m]/wsum);
  const conc = Math.max(...Object.values(weights)) - 1/5;
  // stated
  const st = S.session.stated;
  function stVal(id){ const s=st[id]; if(!s) return null; return s.rev ? 6-s.v : s.v; }
  const statedIntrovert = st['st1'] ? st['st1'].v : null; // raw agree with "social events drain me"
  // ---- engagement screens: honest low-signal detection, never a judgment ----
  const flags = [];
  const cal = S.session.calibration;
  if (cal && cal.readMs!=null && cal.words) {
    const wpm = cal.words / (cal.readMs/60000);
    if (wpm > 900) flags.push('the warm-up passage was closed faster than it could plausibly be read');
  }
  const stVals = Object.values(st).map(s=>s.v);
  const straightline = stVals.length >= 6 && stVals.every(v=>v===stVals[0]);
  if (straightline) flags.push('every self-description got the same rating, including opposite-keyed statements');
  const tos = S.session.compass.tradeoffs;
  const tms = tos.map(t=>t.ms).slice().sort((a,b)=>a-b);
  const tMed = tms.length ? tms[Math.floor(tms.length/2)] : null;
  const tooFastPicks = tMed!=null && tos.length>=10 && tMed < 600;
  if (tooFastPicks) flags.push('the either–or picks came faster than the options could be read');
  const poss = tos.map(t=>t.pos).filter(p=>p===0||p===1);
  const posConstant = poss.length >= 15 && poss.every(p=>p===poss[0]);
  if (posConstant) flags.push('every either–or pick was the same on-screen position across shuffled pairs');
  if (eps.length>=3 && eps.every(e=>Math.abs(e.energy)===5)) flags.push('every day scene was rated at the extreme ±5');
  if (S.session.portfolio && S.session.portfolio.close==='5+' && S.session.portfolio.weekly==='0–2') flags.push('the social-week numbers contradict each other (5+ close people, 0–2 contacts)');
  const drmEnergyTouched = eps.some(e=>e.energyTouched===true || (e.energyTouched===undefined && e.energy!==0));
  const totalCards = slow.reduce((n,a)=>n+a.cardsOpened.length,0);
  const totalPeeks = A.filter(a=>a.kind==='fast' && a.peek && !a.peek.blank).length;
  return {
    graphs: {
      fastSrcLo: fastSrc(lo), fastSrcHi: fastSrc(hi),
      slowSrcLo: slowSrc(lo), slowSrcHi: slowSrc(hi),
      slowMthLo: slowMth(lo), slowMthHi: slowMth(hi),
    },
    congruence: congr.length ? congr.every(Boolean) : null,
    salience, trapPass, drm, friction, attnBeh, react, weights, conc, statedIntrovert,
    answeredArena,
    flags, straightline, lowSignal: flags.length>0,
    motivesLowConfidence: tooFastPicks || posConstant,
    drmEnergyTouched, totalCards, totalPeeks,
    deliberationN: (S.session.deliberation||[]).length,
    deliberationSlowN: (S.session.deliberation||[]).filter(d=>d.mode==='slow').length,
    deliberation: (S.session.deliberation||[]).length ? S.session.deliberation.filter(d=>d.mode==='slow').length / S.session.deliberation.length : null,
    challenge: S.session.challenge,
    stGet: (id)=> st[id] ? st[id].v : null,
  };
}

function bar(label, lo, hi, leftLbl, rightLbl) {
  const track = h('div',{class:'track'});
  function pct(v){ return (50 + v*40) + '%'; }
  if (lo!=null) track.append(h('span',{class:'dot',style:'left:'+pct(lo)}));
  if (hi!=null) track.append(h('span',{class:'dot hi',style:'left:'+pct(hi)}));
  return h('div',null,
    h('div',{class:'reportbar'}, h('div',{class:'lbl'},label), track),
    h('div',{class:'axisends'}, h('span',null,'← '+leftLbl), h('span',null,rightLbl+' →')));
}
function leadCard(R) {
  const m = S.session.compass.spend;
  if (!m) return null;
  const card = h('div',{class:'card',style:'border:1.5px solid var(--gold)'});
  card.append(h('h2',null,'The page you asked for first'));
  if (m==='triumph') {
    const G = R.graphs;
    const leans = [['snap sourcing',G.fastSrcLo],['deliberate sourcing',G.slowSrcLo],['deliberate method',G.slowMthLo]].filter(x=>x[1]!=null);
    const strongest = leans.length ? leans.reduce((a,b)=>Math.abs(b[1])>Math.abs(a[1])?b:a) : null;
    const noEngagement = (R.totalCards + R.totalPeeks) === 0; // opening nothing is not a "lean" — it's an absence of behavior
    card.append(h('p',null, (strongest && !noEngagement) ? 'Your clearest, most decided lean was in '+strongest[0]+'. Wherever you lean hardest is where you’re most predictable — and most yourself.'
      : noEngagement ? 'Honestly: this session didn’t show enough behavior to name a strongest lean — no information cards were opened and no peeks were taken, so there’s nothing decided to point at yet.'
      : 'Not enough answered items to name a strongest area this session.'));
  } else if (m==='truth') {
    let truth = 'The least flattering honest reading available from this session: ';
    if (R.lowSignal) truth += 'the engagement checks flagged this session (see the note above), so the hardest honest truth is that these answers don’t yet show a considered you.';
    else if (R.salience==='flat') truth += 'the stakes never visibly changed your behavior, so your steadiness here is unproven, not proven.';
    else if (!R.straightline && R.statedIntrovert!=null && R.drm.chosenSmallAvg!=null && R.drmEnergyTouched && R.statedIntrovert>=4 && R.drm.chosenSmallAvg>0.5) truth += 'your self-description (“social events drain me”) disagrees with your own reconstructed day.';
    else if (R.congruence===false) truth += 'your pros-and-cons grid pointed one way and you chose another.';
    else truth += 'nothing in your behavioral data contradicted you this session — the harder truths, if any, sit in your written answers, which are still pending coding.';
    card.append(h('p',null,truth));
  } else if (m==='power') {
    card.append(h('p',null,'Cohort comparison needs a cohort. In a class or program deployment, this page shows where your leans sit relative to your group. Solo demo sessions have no group — so this page is a placeholder, honestly labeled.'));
  } else if (m==='novelty') {
    const t = S.session.telemetry.length;
    const fastest = S.session.arena.filter(a=>a.kind==='fast'&&a.respMs).reduce((m2,a)=>a.respMs<m2?a.respMs:m2, 99999);
    const cards = S.session.arena.filter(a=>a.kind==='slow').reduce((n,a)=>n+a.cardsOpened.length,0);
    card.append(h('p',null,'The experimental page: your session in raw numbers. '+t+' recorded events. Fastest snap answer: '+(fastest===99999?'—':(fastest/1000).toFixed(1)+'s')+'. Information cards opened: '+cards+'. This is the exhaust the scoring runs on.'));
  } else if (m==='order') {
    card.append(h('p',null,'Locked and finished, as requested. Everything below is your complete report, no surprises held back.'));
  }
  return card;
}

    scrSittingHeader(2,'Charged moments, a few more decisions, and what you’re working toward.'),

    scrFree(FREE_ITEMS[1]),

    scrDraft(DRAFT_TASKS[0]), scrDraft(DRAFT_TASKS[1]),
    scrCompassPrompt, scrTradeoffs, scrSpend,
    scrStated('Quick self-descriptions (part 1)', STATED_S1, 'In production these arrive as a follow-up on your own time. They’re asked last on purpose — your earlier answers can’t be shaped by them.'),
    scrStated('Quick self-descriptions (part 2)', STATED_S3, null),
    scrDebrief, scrReport,

  // resume — declining does NOT delete the save (a stray reload must never destroy data)
  try {
    const raw = localStorage.getItem('assessment_v2_app');
    const saved = JSON.parse(raw||'null');
    if (saved && saved.screen>0 && saved.screen<=FLOW.length-1) {
      if (confirm('Resume your saved session? (Choosing Cancel starts fresh — the old session is kept as a backup copy in this browser until you clear your data.)')) {
        S.screen = saved.screen; S.session = saved.session; S.withdrawn = saved.withdrawn;
        S._resumeNote = true;
      } else {
        // the fresh run will overwrite the main save; keep the declined session under a backup key so the promise above is true
        try { localStorage.setItem('assessment_v2_app_prev', raw); } catch(e2){}
      }
    }
  } catch(e){}
  render();
})();
</script>
</body>
</html>
