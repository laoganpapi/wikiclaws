<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Assessment — Demo Form A</title>
<style>
  :root {

  * { box-sizing: border-box; }

  .topbar .demo { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; background: var(--neg); padding: 2px 8px; border-radius: 3px; }

  .progresswrap { flex: 1; max-width: 340px; height: 6px; background: rgba(255,255,255,0.22); border-radius: 3px; overflow: hidden; }
  .progressbar { height: 100%; width: 0%; background: #9cc0e4; transition: width 0.4s; }
  .stopbtn { background: transparent; color: #f0b9a8; border: 1px solid #b04a2f; border-radius: 4px; padding: 4px 12px; font-size: 0.72rem; font-family: inherit; cursor: pointer; }

  .stage { max-width: 760px; margin: 0 auto; padding: 36px 22px 90px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; margin: 0 0 10px; }
  h3 { font-size: 1.02rem; margin: 18px 0 6px; }
  p, li { font-size: 0.97rem; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; margin: 14px 0; }
  .scenario { background: var(--gold-soft); border: 1px solid #e0d9c8; border-left: 4px solid var(--gold); border-radius: 6px; padding: 16px 18px; margin: 14px 0; font-size: 1.02rem; }
  .btn { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.9rem; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 11px 22px; cursor: pointer; margin: 6px 8px 6px 0; }
  .btn:hover { background: #24486c; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.secondary:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .opt { display: block; width: 100%; text-align: left; font-family: Georgia, serif; font-size: 0.97rem; background: #fff; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 13px 16px; margin: 8px 0; cursor: pointer; transition: border-color 0.12s, background 0.12s; }

  .opt.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
  .badge { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 12px; margin-right: 8px; }
  .badge.none { background: #e8ece8; color: #4a5a4a; }
  .badge.quarter { background: #f3ead6; color: var(--gold); }
  .badge.certain { background: #f4ddd4; color: var(--neg); }
  .badge.mode { background: var(--accent-soft); color: var(--accent); }
  .clock { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 2rem; font-weight: 700; color: var(--neg); text-align: center; margin: 8px 0; }
  .peekrow { display: flex; gap: 10px; margin: 10px 0; }
  .peek { flex: 1; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; background: #fff; border: 1.5px dashed var(--gold); border-radius: 8px; padding: 10px 12px; cursor: pointer; color: var(--gold); font-weight: 600; text-align: center; }
  .peek:hover { background: var(--gold-soft); }
  .peek.revealed { border-style: solid; color: var(--ink); font-weight: 400; font-family: Georgia, serif; cursor: default; background: var(--gold-soft); text-align: left; }
  .peek.dimmed { opacity: 0.35; pointer-events: none; }
  .shelf { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .shelfcard { flex: 1; min-width: 180px; border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
  .shelfcard .cardtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .shelfcard .cardbody { font-size: 0.88rem; }

  textarea, input[type=text] { width: 100%; font-family: Georgia, serif; font-size: 0.95rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 13px; background: #fff; color: var(--ink); }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 84px; resize: vertical; }
  .gridtool { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; margin: 10px 0; }
  .gridtool table { width: 100%; border-collapse: collapse; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; }
  .gridtool td, .gridtool th { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; }
  .gridtool input[type=text] { font-size: 0.82rem; padding: 5px 8px; }

  .likertrow { display: flex; align-items: center; gap: 6px; margin: 10px 0; flex-wrap: wrap; }

  .likert { display: flex; gap: 4px; }

  .likert button.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

  .aimsg .bubble { background: var(--accent-soft); border-radius: 10px; padding: 11px 15px; font-size: 0.95rem; }

  input[type=range] { flex: 1; accent-color: var(--accent); }
  .episode { display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.82rem; }

  .reportbar { display: flex; align-items: center; margin: 7px 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.74rem; }
  .reportbar .lbl { width: 190px; color: var(--muted); }
  .reportbar .track { flex: 1; height: 13px; background: #eef0f2; border-radius: 7px; position: relative; }

  .reportbar .dot.hi { background: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .axisends { display: flex; justify-content: space-between; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.63rem; color: var(--muted); margin: 1px 0 8px 190px; }
  .pending { display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.64rem; font-weight: 700; color: var(--gold); border: 1px dashed var(--gold); border-radius: 3px; padding: 0 6px; letter-spacing: 0.04em; }
  .pass { color: var(--pos); font-weight: 700; } .flag { color: var(--neg); font-weight: 700; }
  .footer-note { color: var(--muted); font-size: 0.8rem; font-style: italic; margin-top: 28px; }
  .fade { animation: fadein 0.35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }
  @media (max-width: 640px) { .peekrow, .shelf { flex-direction: column; } .reportbar .lbl { width: 120px; } .axisends { margin-left: 120px; } }
</style>

// ---------- State ----------
const S = {
  screen: 0,
  withdrawn: false,
  session: {
    startedAt: new Date().toISOString(),
    consent: {}, intake: {}, calibration: {},
    arena: [], drm: { episodes: [] }, portfolio: {},
    reviews: [], dispute: null, friction: {}, sjt: [], drafts: [],
    compass: { prompt: [], tradeoffs: [], spend: null },
    stated: {}, challenge: null,
    telemetry: [],
  }
};
function tlog(ev, data) { S.session.telemetry.push({ t: Date.now(), ev, ...(data||{}) }); }
function save() { try { localStorage.setItem('assessment_demo_v2', JSON.stringify({ screen: S.screen, session: S.session, withdrawn: S.withdrawn })); } catch(e){} }

// ---------- Tiny DOM helpers ----------
const stage = document.getElementById('stage');
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  return el;
}
function clearStage() { stage.innerHTML = ''; window.scrollTo(0,0); }
function aiSay(text) { return h('div',{class:'aimsg'}, h('div',{class:'avatar'},'AI'), h('div',{class:'bubble'}, text)); }

// ---------- Flow ----------
let FLOW = [];
function next() { S.screen++; save(); render(); }
function render() {
  clearStage();
  document.getElementById('progressbar').style.width = Math.min(100, Math.round(100 * S.screen / (FLOW.length - 1))) + '%';
  const scr = FLOW[Math.min(S.screen, FLOW.length - 1)];
  const el = h('div', { class: 'fade' });
  stage.appendChild(el);
  scr(el);
}

// ---------- Screens ----------

      h('p',{class:'muted small'},'Demo Form A: reduced item set, all mechanics live. Everything stays in this browser until you choose to export it. No data leaves this page.')
    ),
    h('button',{class:'btn',onclick:()=>{ tlog('welcome_done'); next(); }},'Begin')
  );
}

// ---- Fast Arena item ----
function scrFast(item) {
  return function(el) {
    const rec = { id:item.id, kind:'fast', tier:item.tier, type:item.type, readMs:null, respMs:null, peek:null, choice:null, driver:'', load:null, variant:item._variant||null };
    let readStart = Date.now(), clockTimer = null, respStart = null, answered = false;
    el.append(
      h('div',null, h('span',{class:'badge '+item.tier}, TIERS[item.tier]), h('span',{class:'badge mode'},'SNAP — 5 seconds once you’re ready')),
      h('div',{class:'scenario'}, item.text));
    // load task
    if (item.load) {
      const code = String(1000 + Math.floor(Math.random()*9000));
      rec.load = { code, recalled:null };
      el.append(h('p',{class:'small muted'},'Extra: hold this code in your head. You’ll be asked for it after you answer.'),
        h('div',{class:'codebox'}, code));
    }
    const answerZone = h('div',{class:'hidden'});
    const clock = h('div',{class:'clock'},'5.0');
    function finish(choiceIdx, timedOut) {
      if (answered) return; answered = true;
      clearInterval(clockTimer);
      rec.respMs = Date.now()-respStart;
      rec.choice = timedOut ? null : choiceIdx;
      rec.timedOut = !!timedOut;
      answerZone.innerHTML = '';
      const after = h('div',{class:'fade'});
      if (timedOut) after.append(h('p',{class:'muted'},'Time. No answer recorded — that’s okay, it happens.'));
      const driver = h('input',{type:'text',placeholder:'One line: what drove that?',oninput:e=>rec.driver=e.target.value});
      after.append(h('h3',null, item._driverPrompt || 'What drove that?'), driver);
      if (item.load) {
        const codeInp = h('input',{type:'text',placeholder:'The 4-digit code you were holding',style:'margin-top:8px',oninput:e=>rec.load.recalled=e.target.value});
        after.append(codeInp);
      }
      after.append(h('button',{class:'btn',style:'margin-top:10px',onclick:()=>{ S.session.arena.push(rec); tlog('fast_done',{id:item.id}); next(); }},'Continue'));
      answerZone.classList.remove('hidden');
      answerZone.append(after);
    }
    function startClock() {
      rec.readMs = Date.now()-readStart;
      respStart = Date.now();
      answerZone.classList.remove('hidden');
      const opts = item._variant ? TRAP_ITEM.variants.find(v=>v.key===item._variant).options : item.options;
      const peekrow = h('div',{class:'peekrow'});
      if (item.peekData) {
        const pd = h('div',{class:'peek',onclick:()=>{ if(rec.peek) return; rec.peek={which:'data', atMs:Date.now()-respStart}; pd.classList.add('revealed'); pd.textContent=item.peekData; pp.classList.add('dimmed'); }},'📄 Peek: the data');
        const pp = h('div',{class:'peek',onclick:()=>{ if(rec.peek) return; rec.peek={which:'principle', atMs:Date.now()-respStart}; pp.classList.add('revealed'); pp.textContent=item.peekPrinciple; pd.classList.add('dimmed'); }},'🧭 Peek: what you said matters');
        peekrow.append(pd, pp);
        answerZone.append(h('p',{class:'small muted',style:'margin:4px 0'},'One free peek if you want it — the clock keeps running:'), peekrow);
      } else {
        answerZone.append(h('p',{class:'small muted'},'The one extra card here is sealed — snap answers can’t open it.'));
      }
      answerZone.append(clock);
      opts.forEach((o,i)=> answerZone.append(h('button',{class:'opt',onclick:()=>finish(i,false)}, o)));
      const t0 = Date.now();
      clockTimer = setInterval(()=>{
        const left = 5000-(Date.now()-t0);
        clock.textContent = Math.max(0,left/1000).toFixed(1);
        if (left<=0) finish(null,true);
      },100);
    }
    el.append(h('p',{class:'small muted'},'Read as long as you like. The 5-second clock starts when you tap ready.'),
      h('button',{class:'btn',onclick:e=>{ e.target.remove(); startClock(); }},'I’m ready'), answerZone);
  };
}

// ---- Slow Arena item ----
function scrSlow(item) {
  return function(el) {
    const rec = { id:item.id, kind:'slow', tier:item.tier, type:item.type, cardsOpened:[], grid:null, choice:null, rationale:'', respMs:null, timeExpired:false };
    const start = Date.now();
    let budget = 3;
    const budgetLbl = h('span',{class:'badge mode'},'Card budget: 3');
    el.append(h('div',null, h('span',{class:'badge '+item.tier}, TIERS[item.tier]), h('span',{class:'badge mode'},'DELIBERATE — up to 4 minutes'), budgetLbl),
      h('div',{class:'scenario'}, item.text));
    const shelf = h('div',{class:'shelf'});
    item.cards.forEach((c,i)=>{
      const body = h('div',{class:'cardbody hidden'}, c.b);
      const btn = h('button',{onclick:()=>{
        if (budget<=0) return;
        budget--; budgetLbl.textContent = 'Card budget: '+budget;
        rec.cardsOpened.push({ idx:i, title:c.t, atMs:Date.now()-start });
        body.classList.remove('hidden'); btn.remove();
      }},'Open card');
      shelf.append(h('div',{class:'shelfcard'}, h('div',{class:'cardtitle'}, c.t), btn, body));
    });
    el.append(h('p',{class:'small muted'},'Three information cards. Open any, all, or none — your call.'), shelf);
    // grid tool
    const gridRows = [];
    const gridWrap = h('div',{class:'hidden'});
    const gridBtn = h('button',{class:'btn secondary',onclick:()=>{
      gridBtn.remove(); gridWrap.classList.remove('hidden');
      rec.grid = { openedAtMs: Date.now()-start, rows: gridRows };
    }},'Open the pros & cons grid (optional)');
    const tbl = h('table',null, h('tr',null, h('th',null,'Option'), h('th',null,'For it'), h('th',null,'Against it'), h('th',null,'Weight')));
    item.options.forEach((o,i)=>{
      const row = { opt:i, pro:'', con:'', w:'0' };
      gridRows.push(row);
      tbl.append(h('tr',null,
        h('td',{class:'small'}, o.length>34 ? o.slice(0,32)+'…' : o),
        h('td',null,h('input',{type:'text',oninput:e=>row.pro=e.target.value})),
        h('td',null,h('input',{type:'text',oninput:e=>row.con=e.target.value})),
        h('td',null,h('select',{onchange:e=>row.w=e.target.value}, ...['0','1','2','3'].map(w=>h('option',null,w))))));
    });
    gridWrap.append(h('div',{class:'gridtool'}, tbl));
    el.append(gridBtn, gridWrap);
    // choice + rationale
    let chosen = null;
    const optBtns = [];
    const choiceZone = h('div',null, h('h3',null,'Your decision'));
    item.options.forEach((o,i)=>{
      const b = h('button',{class:'opt',onclick:()=>{ chosen=i; optBtns.forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); }},o);
      optBtns.push(b); choiceZone.append(b);
    });
    const rat = h('textarea',{placeholder:'Why? A few sentences, however you’d naturally explain it.',oninput:e=>rec.rationale=e.target.value});
    const timerLbl = h('span',{class:'muted small'},'4:00 left');
    const submit = h('button',{class:'btn',onclick:()=>{
      if (chosen==null) { alert('Pick an option first.'); return; }
      clearInterval(tick);
      rec.choice = chosen; rec.respMs = Date.now()-start;
      S.session.arena.push(rec); tlog('slow_done',{id:item.id}); next();
    }},'Submit decision');
    const tick = setInterval(()=>{
      const left = 240000-(Date.now()-start);
      if (left<=0) { rec.timeExpired=true; timerLbl.textContent='Time — wrap up and submit.'; clearInterval(tick); return; }
      timerLbl.textContent = Math.floor(left/60000)+':'+String(Math.floor((left%60000)/1000)).padStart(2,'0')+' left';
    },500);
    el.append(choiceZone, h('h3',null,'Your reasoning'), rat, h('div',{style:'display:flex;align-items:center;gap:14px;margin-top:10px'}, submit, timerLbl));
  };
}

}

  function show() {
    wrap.innerHTML='';
    if (idx>=order.length) { tlog('tradeoffs_done'); next(); return; }
    const t = TRADEOFFS[order[idx]];
    const flip = Math.random()<0.5;
    const first = flip ? t.b : t.a, second = flip ? t.a : t.b;
    const shownAt = Date.now();
    wrap.append(h('p',{class:'small muted'},(idx+1)+' of '+order.length),
      h('button',{class:'opt',onclick:()=>{ S.session.compass.tradeoffs.push({pair:order[idx], won:first.m, lost:second.m, ms:Date.now()-shownAt}); idx++; show(); }},first.t),
      h('button',{class:'opt',onclick:()=>{ S.session.compass.tradeoffs.push({pair:order[idx], won:second.m, lost:first.m, ms:Date.now()-shownAt}); idx++; show(); }},second.t));
  }
  show();
  el.append(wrap);
}

function scrSpend(el) {
  el.append(h('h2',null,'Last choice'),

  SPEND_OPTIONS.forEach((o)=>{
    el.append(h('button',{class:'opt',onclick:()=>{ S.session.compass.spend = o.m; tlog('spend',{m:o.m}); next(); }},o.t));

}

// ---- Stated batteries ----
function scrStated(title, items, note) {
  return function(el) {
    el.append(h('h2',null,title), note?h('p',{class:'muted small'},note):null);
    const card = h('div',{class:'card'});
    const scale = ['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];
    items.forEach(it=>{
      const row = h('div',{class:'likertrow'}, h('div',{class:'stmt'},it.text),
        h('div',{class:'likert'}, ...scale.map((s,v)=>h('button',{onclick:e=>{
          S.session.stated[it.id] = { v: v+1, rev: !!it.rev, metric: it.metric };
          [...e.target.parentElement.children].forEach(x=>x.classList.remove('selected'));
          e.target.classList.add('selected');
        }},String(v+1)))));
      card.append(row);
    });
    el.append(card, h('p',{class:'small muted'},'1 = strongly disagree · 5 = strongly agree'),
      h('button',{class:'btn',onclick:()=>{ tlog('stated_done',{title}); next(); }},'Continue'));
  };
}

// ---- Debrief ----
function scrDebrief(el) {
  el.append(h('h1',null,'Before your report: what was staged'),
    h('div',{class:'card'},
      h('p',null,'Two moments in this assessment were deliberate, and you agreed to that up front. Here they are by name:'),
      h('ul',null,
        h('li',null, h('b',null,'The pushback.'), ' When I challenged one of your answers, that was a standard moment every respondent gets. There was nothing wrong with your answer.'),
        h('li',null, h('b',null,'The confusing task.'), ' The garbled ordering question was worded that way on purpose, for everyone. Your reaction to the confusion — and how quickly you settled once it was fixed — is part of how steadiness is read.')),
      h('p',null,'Nothing else was staged. No answer anywhere was scored as right or wrong.'),

// ---------- Scoring ----------
function score() {
  const A = S.session.arena;
  const fast = A.filter(a=>a.kind==='fast' && a.type!=='trap');
  const slow = A.filter(a=>a.kind==='slow');
  const tierNum = { none:0, quarter:1, certain:2 };
  function mean(xs){ return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
  // fast sourcing: peek data=+1, principle=-1, none=0 skip
  function fastSrc(tiers){ const xs = fast.filter(a=>tiers.includes(a.tier) && a.peek).map(a=>a.peek.which==='data'?1:-1); return mean(xs); }
  // slow sourcing: cards opened /3 -> [-1,1]
  function slowSrc(tiers){ const xs = slow.filter(a=>tiers.includes(a.tier)).map(a=>(a.cardsOpened.length/3)*2-1); return mean(xs); }
  // slow method: grid engaged & filled = +1, opened-empty = 0, unopened = -1
  function slowMth(tiers){ const xs = slow.filter(a=>tiers.includes(a.tier)).map(a=>{
    if (!a.grid) return -1;
    const filled = a.grid.rows.some(r=>r.pro||r.con||r.w!=='0');
    return filled ? 1 : 0;
  }); return mean(xs); }
  // grid congruence: weighted winner matches choice?
  const congr = slow.filter(a=>a.grid && a.grid.rows.some(r=>r.w!=='0')).map(a=>{
    const best = a.grid.rows.reduce((m,r)=>Number(r.w)>Number(m.w)?r:m, a.grid.rows[0]);
    return best.opt===a.choice;
  });
  const lo = ['none'], hi = ['certain'], all=['none','quarter','certain'];
  const drift = (f)=> (f(hi)!=null&&f(lo)!=null) ? f(hi)-f(lo) : null;
  // salience: did behavior differ lo vs hi at all
  const salience = [slowSrc, slowMth, fastSrc].some(f=>{ const d=drift(f); return d!=null && Math.abs(d)>=0.3; });
  // trap
  const trap = A.find(a=>a.type==='trap');
  let trapPass = null;
  if (trap && trap.choice!=null) {
    const v = TRAP_ITEM.variants.find(x=>x.key===trap.variant);
    trapPass = trap.choice !== v.sealedFavors ? true : 'inconclusive';
  }
  // DRM
  const eps = S.session.drm.episodes;
  const social = eps.filter(e=>e.company!=='Alone' && e.company!=='Alone but online');
  const chosenSmall = eps.filter(e=>e.chosen==='chosen' && ['One close person','Small familiar group'].includes(e.company));
  const obligedBig = eps.filter(e=>e.chosen==='obliged' && ['Large or unfamiliar group'].includes(e.company));
  const soloChosen = eps.filter(e=>e.chosen==='chosen' && e.company.startsWith('Alone'));
  const drm = {
    socialAvg: mean(social.map(e=>e.energy)),
    chosenSmallAvg: mean(chosenSmall.map(e=>e.energy)),
    obligedBigAvg: mean(obligedBig.map(e=>e.energy)),
    soloChosenAvg: mean(soloChosen.map(e=>e.energy)),
  };
  // SJT
  const friction = mean(S.session.sjt.map(r=>r.choiceV));
  const probeChoices = S.session.sjt.flatMap(r=>r.probes);
  const attnBeh = probeChoices.length ? (probeChoices.filter(p=>p==='self').length/probeChoices.length)*(-2)+1 : null; // -1 all self .. +1 all field
  // friction probe reactivity
  const F = S.session.friction;
  const react = (F.confusedMs!=null && F.recoveryMs!=null) ? { confusedS:(F.confusedMs/1000).toFixed(1), recoveryS:(F.recoveryMs/1000).toFixed(1) } : null;
  // motives
  const wins = {}, appear = {};
  Object.keys(MOTIVES).forEach(m=>{wins[m]=0;appear[m]=0;});
  S.session.compass.tradeoffs.forEach(t=>{ wins[t.won]++; appear[t.won]++; appear[t.lost]++; });
  const weights = {};
  Object.keys(MOTIVES).forEach(m=>{ weights[m] = appear[m] ? wins[m]/appear[m] : 0; });
  if (S.session.compass.spend) weights[S.session.compass.spend] = Math.min(1, (weights[S.session.compass.spend]||0)+0.1);
  const wsum = Object.values(weights).reduce((a,b)=>a+b,0)||1;
  Object.keys(weights).forEach(m=>weights[m]=weights[m]/wsum);
  const conc = Math.max(...Object.values(weights)) - 1/5;
  // stated
  const st = S.session.stated;
  function stVal(id){ const s=st[id]; if(!s) return null; return s.rev ? 6-s.v : s.v; }
  const statedIntrovert = st['st1'] ? st['st1'].v : null; // raw agree with "social events drain me"
  return {
    graphs: {
      fastSrcLo: fastSrc(lo), fastSrcHi: fastSrc(hi),
      slowSrcLo: slowSrc(lo), slowSrcHi: slowSrc(hi),
      slowMthLo: slowMth(lo), slowMthHi: slowMth(hi),
    },
    congruence: congr.length ? congr.every(Boolean) : null,
    salience, trapPass, drm, friction, attnBeh, react, weights, conc, statedIntrovert,
    deliberationNote: null,
  };
}

// ---- Report ----
function bar(label, lo, hi, leftLbl, rightLbl) {
  const track = h('div',{class:'track'});
  function pct(v){ return (50 + v*40) + '%'; }
  if (lo!=null) track.append(h('span',{class:'dot',style:'left:'+pct(lo)}));
  if (hi!=null) track.append(h('span',{class:'dot hi',style:'left:'+pct(hi)}));
  return h('div',null,
    h('div',{class:'reportbar'}, h('div',{class:'lbl'},label), track),
    h('div',{class:'axisends'}, h('span',null,'← '+leftLbl), h('span',null,rightLbl+' →')));
}
function scrReport(el) {
  const R = score();
  const G = R.graphs;
  el.append(h('h1',null,'Your report'), h('p',{class:'muted small'},'Demo scoring: behavioral channels scored live in this browser; written answers are captured for expert-checked AI coding and marked pending.'));
  // Thinking machine
  const tcard = h('div',{class:'card'});
  tcard.append(h('h2',null,'How you think'),
    h('p',{class:'small muted'},'Blue dot = low stakes · gold dot = high stakes (certain review). Dots missing where you skipped peeks or items.'),
    bar('SNAP · where you reach', G.fastSrcLo, G.fastSrcHi, 'Your own compass', 'Outside data'),
    bar('DELIBERATE · where you reach', G.slowSrcLo, G.slowSrcHi, 'Your own compass', 'Outside data'),
    bar('DELIBERATE · how you build', G.slowMthLo, G.slowMthHi, 'By feel', 'With structure'),
    h('p',{class:'small'},'Snap “how you build” and everything in your written reasoning: ', h('span',{class:'pending'},'PENDING AI CODING')),
    h('p',{class:'small'},'Stake-salience check: ', R.salience? h('span',{class:'pass'},'PASS — the review badges changed your behavior, so your profile is interpretable.') : h('span',{class:'flag'},'NOT DETECTED — stakes didn’t visibly move your behavior; flat lines here can’t be read as stability.')),
    R.trapPass!=null ? h('p',{class:'small'},'Snap honesty check: ', R.trapPass===true? h('span',{class:'pass'},'PASS') : h('span',{class:'muted'},'inconclusive (single trap, single respondent)')) : null,
    R.congruence!=null ? h('p',{class:'small'},'Grid congruence: '+(R.congruence?'your grid’s winner matched your choice.':'your grid pointed one way and you chose another — flagged, not judged.')) : null);
  el.append(tcard);
  // Energy
  const ecard = h('div',{class:'card'}, h('h2',null,'Where your energy goes'));
  const D = R.drm;
  function fmtE(v){ return v==null?'—':(v>0?'+':'')+v.toFixed(1); }
  ecard.append(h('p',null,'From your reconstructed day: chosen small company averaged ', h('b',null,fmtE(D.chosenSmallAvg)), ', big obligatory settings averaged ', h('b',null,fmtE(D.obligedBigAvg)), ', chosen alone-time averaged ', h('b',null,fmtE(D.soloChosenAvg)), '.'));
  if (R.statedIntrovert!=null && D.chosenSmallAvg!=null) {
    const saysDrained = R.statedIntrovert>=4, dayCharged = D.chosenSmallAvg>0.5;
    if (saysDrained && dayCharged) ecard.append(h('p',null,'You rated “social events drain me” as true of you — but your actual day says small, chosen company charged you. What drains you looks more specific: big, obligatory settings. Different problem, different fix.'));
    else if (!saysDrained && !dayCharged) ecard.append(h('p',null,'Your self-description and your reconstructed day mostly agree.'));
    else ecard.append(h('p',null,'Your self-description and your day mostly line up on this one.'));
  }
  ecard.append(h('p',{class:'small'},'Your messages (the hard-conversation drafts): what you chose to raise and how directly — ', h('span',{class:'pending'},'PENDING AI CODING')));
  el.append(ecard);
  // Room
  const rcard = h('div',{class:'card'}, h('h2',null,'You, in charged moments'));
  if (R.friction!=null) rcard.append(h('p',null,'Across the scenarios you leaned ', h('b',null, R.friction>0.25?'toward addressing friction directly':R.friction<-0.25?'toward smoothing things over':'neither pole strongly'),' (score '+R.friction.toFixed(2)+' on −1 smooth … +1 press).'));
  if (R.attnBeh!=null) rcard.append(h('p',null,'Your quick mental checks before acting went ', h('b',null, R.attnBeh<-0.25?'mostly to your own reaction':R.attnBeh>0.25?'mostly to reading the room':'both ways'),'.'));
  if (R.react) rcard.append(h('p',null,'The deliberately confusing task took you '+R.react.confusedS+'s to push through; once fixed, you settled in '+R.react.recoveryS+'s. Because you were warned staged moments existed, read this as the floor of your steadiness, not the ceiling.'));
  rcard.append(h('p',{class:'small'},'Your pushback reply and attention answers: ', h('span',{class:'pending'},'PENDING AI CODING')));
  el.append(rcard);
  // Compass
  const ccard = h('div',{class:'card'}, h('h2',null,'What you’re chasing'));
  const sorted = Object.entries(R.weights).sort((a,b)=>b[1]-a[1]);
  sorted.forEach(([m,w])=>{
    ccard.append(h('div',{class:'reportbar'}, h('div',{class:'lbl'},MOTIVES[m]+(S.session.compass.spend===m?' ★':'')),
      h('div',{class:'track'}, h('span',{style:'position:absolute;left:0;top:0;height:100%;width:'+(w*100)+'%;background:var(--accent);border-radius:7px;opacity:0.75'}))));
  });
  ccard.append(h('p',{class:'small muted'},'★ = where you spent your final choice. Weights from your 16 either–or picks.'),
    h('p',{class:'small'},'Your own words about what you’re working toward: ', h('span',{class:'pending'},'PENDING AI CODING'), ' — the stated–revealed comparison lands there.'));
  el.append(ccard);
  // Export
  el.append(h('div',{class:'card'},
    h('h2',null,'Your data'),
    h('p',{class:'small'},'Everything captured this session — every timestamp, peek, card, draft, and answer — belongs to you. Export it, or clear it from this browser.'),
    h('button',{class:'btn',onclick:()=>{
      const blob = new Blob([JSON.stringify(S.session,null,2)],{type:'application/json'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='assessment_session.json'; a.click();
    }},'Export session JSON'),
    h('button',{class:'btn secondary',onclick:()=>{ localStorage.removeItem('assessment_demo_v2'); location.reload(); }},'Clear & restart')),
    h('p',{class:'footer-note'},'Demo Form A. Behavioral scoring is live; free-text coding, error bars, and cohort-referenced values require the production scoring service. A reading at your age is a reading of your age — minors’ results expire after 18 months in production.'));
}

// ---------- Withdrawal ----------
document.getElementById('stopbtn').addEventListener('click', ()=>{
  if (S.withdrawn) return;
  if (confirm('Stop the assessment? Completely fine — no penalty. You’ll go straight to the explanation page and a report of whatever you completed.')) {
    S.withdrawn = true; tlog('withdrawn');
    S.screen = FLOW.length - 2; // debrief
    save(); render();
  }
});

// ---------- Build flow ----------
(function build(){
  // trap variant assignment
  const variant = Math.random()<0.5 ? 'A' : 'B';
  const trapDef = TRAP_ITEM.variants.find(v=>v.key===variant);
  const trapItem = { id:'T1', tier:'none', type:'trap', _variant:variant, text:trapDef.text, options:trapDef.options, peekData:null, peekPrinciple:null, _driverPrompt:'What tipped it?' };
  // driver prompt variation (anti-template)
  const prompts = ['What drove that?','What tipped it?','In one line — why that one?','What was the deciding thing?','Gut check: why?'];
  FAST_ITEMS.forEach((f,i)=>f._driverPrompt = prompts[i%prompts.length]);
  FLOW = [
    scrWelcome, scrConsent, scrIntake, scrCalibration,
    scrSittingHeader(1,'About 40 minutes in production; shorter in this demo. Decision scenarios, then a walk through yesterday.'),
    scrFast(FAST_ITEMS[0]), scrSlow(SLOW_ITEMS[0]), scrFast(FAST_ITEMS[1]), scrFast(trapItem), scrSlow(SLOW_ITEMS[1]), scrFast(FAST_ITEMS[2]),
    scrDRM, scrPortfolio,
    scrReview(1),
    scrSittingHeader(2,'Charged moments, a few more decisions, and what you’re working toward.'),
    scrFast(FAST_ITEMS[3]), scrSlow(SLOW_ITEMS[2]), scrFast(FAST_ITEMS[4]),
    scrFriction,
    scrSlow(SLOW_ITEMS[3]),
    scrReview(2), scrDispute,
    scrSJT(SJT_ITEMS[0]), scrSJT(SJT_ITEMS[1]), scrSJT(SJT_ITEMS[2]),
    scrDraft(DRAFT_TASKS[0]), scrDraft(DRAFT_TASKS[1]),
    scrCompassPrompt, scrTradeoffs, scrSpend,
    scrStated('Quick self-descriptions (part 1)', STATED_S1, 'In production these arrive as a follow-up on your own time. They’re asked last on purpose — your earlier answers can’t be shaped by them.'),
    scrStated('Quick self-descriptions (part 2)', STATED_S3, null),
    scrDebrief, scrReport,
  ];
  // resume
  try {
    const saved = JSON.parse(localStorage.getItem('assessment_demo_v2')||'null');
    if (saved && saved.screen>0 && saved.screen<FLOW.length-1 && confirm('Resume your saved session?')) {
      S.screen = saved.screen; S.session = saved.session; S.withdrawn = saved.withdrawn;
    } else if (saved) { localStorage.removeItem('assessment_demo_v2'); }
  } catch(e){}
  render();
})();
